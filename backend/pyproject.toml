[project]
name = "pilot-api"
version = "0.1.0"
description = "API de PILOT, plateforme de pilotage de projets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
